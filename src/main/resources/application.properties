server.port=8091

allowed.origins=${ALLOWED_ORIGINS}
url.back=${URL_BACK}

# PostgreSQL
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

# S3 (Yandex Object Storage, свой бакет)
s3.bucket.name=${S3_BUCKET_NAME}
s3.region=${S3_REGION}
s3.endpoint=${S3_ENDPOINT}
s3.access-key-id=${S3_ACCESS_KEY_ID}
s3.secret-access-key=${S3_SECRET_ACCESS_KEY}

# Kinescope (видео уроков). Необязательные: без токена работает только режим
# «вставить ссылку», кнопка загрузки в админке вернёт понятную ошибку.
# parent-id — UUID проекта или папки в кабинете Kinescope.
# callback-user/password — Basic-пара, с которой Kinescope зовёт наш /api/kinescope/drm-auth
# (та же пара указывается при регистрации колбэка через их API).
kinescope.api-token=${KINESCOPE_API_TOKEN:}
kinescope.parent-id=${KINESCOPE_PARENT_ID:}
kinescope.video-token.ttl-seconds=${KINESCOPE_VIDEO_TOKEN_TTL_SECONDS:14400}
kinescope.drm.callback-user=${KINESCOPE_DRM_CALLBACK_USER:}
kinescope.drm.callback-password=${KINESCOPE_DRM_CALLBACK_PASSWORD:}

# Email (NotiSend)
email.notisend.api.key=${EMAIL_NOTISEND_API_KEY:}
email.notisend.email.address=${EMAIL_NOTISEND_EMAIL_ADDRESS:}
email.notisend.from.name=${EMAIL_NOTISEND_FROM_NAME:}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration.seconds=${JWT_EXPIRATION_SECONDS:2592000}

# anyforms-5: проверка оплаченного доступа к курсу.
# SERVICE_JWT_TOKEN — один межсервисный токен на все проекты
# (anyforms-5, telegram-pusher, edu): одно и то же значение везде.
# Обязательные: без них приложение не стартует
anyforms.api.url=${ANYFORMS_API_URL}
anyforms.service.jwt.token=${SERVICE_JWT_TOKEN}

management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
